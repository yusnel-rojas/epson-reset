#This file is generated by updateDaemonJvm
# Pin the Gradle daemon to a JDK 21 (matches jvmToolchain(21) and CI's Temurin 21).
# ProGuard release builds parse the jmods of the JDK running Gradle, and ProGuard 7.7
# only reads class files up to Java 24 — a newer daemon JDK fails with
# "Unsupported version number". No download URLs: Gradle auto-detects installed JDKs.
toolchainVersion=21
