name: Build & package

# Packaging runs on demand and on v* tags, not on every push — several runners per commit is a lot of
# minutes for installers nobody downloads. Tests run per-push in ci.yml.

on:
  push:
    tags: [ 'v*' ]       # tagging vX.Y.Z sets the installer version and publishes a Release
  # Run packaging manually from the Actions tab. Pick the branch to run from in the "Run workflow"
  # dropdown, and one platform to build — e.g. windows-x64 to get an .exe to test on a Windows PC —
  # without cutting a release. "all" (the default) builds every platform, as a tag push does.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to package"
        type: choice
        default: all
        options:
          - all
          - windows-x64
          - macos-arm64
          - linux-x64
          - linux-arm64
  # pull_request:        # uncomment to package every PR

jobs:
  # Builds the matrix, narrowed to the platform a manual run asked for. A tag push (or the default
  # "all") leaves every platform in. Keeping the full list here as JSON means one source of truth for
  # both the picker and the build.
  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          # Empty on a tag push (inputs is unset there), which falls through to "all".
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          all='[
            {"os":"macos-latest","task":"packageDmg","glob":"build/compose/binaries/main/dmg/*.dmg","artifact":"EpsonReset-macos-arm64"},
            {"os":"windows-latest","task":"createDistributable","glob":"build/installer/windows/*.exe","artifact":"EpsonReset-windows-x64"},
            {"os":"ubuntu-22.04","task":"createDistributable packageDeb","glob":"build/compose/binaries/main/deb/*.deb","artifact":"EpsonReset-linux-x64","appimage_arch":"x86_64"},
            {"os":"ubuntu-22.04-arm","task":"createDistributable packageDeb","glob":"build/compose/binaries/main/deb/*.deb","artifact":"EpsonReset-linux-arm64","appimage_arch":"aarch64"}
          ]'
          if [ "$PLATFORM" = "all" ]; then
            include=$(echo "$all" | jq -c '.')
          else
            include=$(echo "$all" | jq -c --arg p "EpsonReset-$PLATFORM" '[.[] | select(.artifact == $p)]')
          fi
          echo "Selected platform: $PLATFORM"
          echo "$include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.artifact }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # jpackage ships inside a full JDK; Temurin 21 matches jvmToolchain(21) and the daemon pin in
      # gradle/gradle-daemon-jvm.properties, which resolves against installed JDKs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies and the build cache between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Sign macOS builds only when a certificate secret is configured — otherwise produce an
      # unsigned .dmg rather than failing the build.
      - name: Detect macOS signing
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Package Compose distribution
        shell: bash      # makes ./gradlew work the same way on the Windows runner
        run: ./gradlew ${{ matrix.task }} --stacktrace
        env:
          # On a tag ref github.ref_name is "vX.Y.Z"; build.gradle.kts strips the leading "v".
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Compose's macOS signing block reads these; SIGN_APP gates whether it signs at all.
          SIGN_APP: ${{ steps.signing.outputs.enabled == 'true' && 'true' || 'false' }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Compose's TargetFormat.AppImage produces a jpackage app-image directory, not a freedesktop
      # .AppImage file. packageDeb already builds that same relocatable directory; make it the
      # payload of a standards-compliant AppDir and pass it to appimagetool.
      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
        run: ./scripts/package-appimage.sh ${{ matrix.appimage_arch }} "$APP_VERSION"

      # The driverless spooler path needs nothing bundled. This DLL is only for the advanced libusb
      # fallback; dropping it into the app image (which the .iss ships wholesale) means that path
      # needs no manual file placement either. Best-effort: a fetch failure must not fail packaging.
      - name: Bundle libusb for the fallback
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ver = "1.0.27"
          $sourceDir = Join-Path (Get-Location).Path "build\compose\binaries\main\app\EpsonReset"
          $archive = Join-Path $env:RUNNER_TEMP "libusb.7z"
          $extract = Join-Path $env:RUNNER_TEMP "libusb"
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v$ver/libusb-$ver.7z" -OutFile $archive
          & 7z x $archive -o"$extract" -y | Out-Null
          # Bundle the MinGW64 build: it imports only always-present system DLLs (kernel32/msvcrt/
          # user32), whereas the MSVC build (MS64) needs VCRUNTIME140, which a clean Windows may lack.
          $dll = Join-Path $extract "MinGW64\dll\libusb-1.0.dll"
          if (!(Test-Path $dll)) { throw "libusb-1.0.dll not found at $dll" }
          # JNA loads the name "usb-1.0", so ship it spelled that way next to the launcher.
          Copy-Item $dll (Join-Path $sourceDir "usb-1.0.dll") -Force
          Write-Host "Bundled MinGW64 libusb-1.0.dll as usb-1.0.dll in the app image."

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          $version = $env:APP_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.0.0"
          }
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          $repo = (Get-Location).Path
          $scriptDir = Join-Path $repo "installer\windows"
          $sourceDir = Join-Path $repo "build\compose\binaries\main\app\EpsonReset"
          $outputDir = Join-Path $repo "build\installer\windows"
          $launcher = Join-Path $sourceDir "EpsonReset.exe"

          if (!(Test-Path $launcher)) {
            Get-ChildItem -Recurse (Join-Path $repo "build\compose\binaries") | Select-Object FullName
            throw "Expected Windows launcher was not found: $launcher"
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Write-Host "Using app image: $sourceDir"
          Write-Host "Writing installer to: $outputDir"

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "iscc.exe"
          }

          Push-Location $scriptDir
          try {
            & $iscc "EpsonReset.iss" "/DAppVersion=$version"
          } finally {
            Pop-Location
          }

      # A no-install alternative: zip the same jpackage app image (libusb DLL and all). Extract it
      # anywhere and run EpsonReset.exe — handy for quick testing on a Windows PC.
      - name: Package portable zip (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $appDir = Join-Path (Get-Location).Path "build\compose\binaries\main\app\EpsonReset"
          $outDir = Join-Path (Get-Location).Path "build\portable\windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # -Path <dir> keeps the top EpsonReset\ folder inside the zip, so it extracts self-contained.
          Compress-Archive -Path $appDir -DestinationPath (Join-Path $outDir "EpsonReset-windows-x64-portable.zip") -Force
          Write-Host "Wrote portable zip to $outDir"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: EpsonReset-windows-x64-portable
          path: build/portable/windows/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: EpsonReset-${{ matrix.appimage_arch }}
          path: build/appimage/*.AppImage
          if-no-files-found: error

  # Attaches the packages to a GitHub Release when the workflow runs against a v* tag. Manual
  # runs on a branch only upload build artifacts.
  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # GITHUB_TOKEN needs this to create the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each artifact folder is named for its platform/architecture and holds one version-named
      # package. Rename each to "<folder>.<ext>" so release assets get stable,
      # version-less names that releases/latest/download/<name> links can point at.
      - name: Rename installers to stable names
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            file="$(ls "$d" | head -n1)"
            mv "$d$file" "$name.${file##*.}"
          done
          ls -la

      # Publishing to this same repo, so the default GITHUB_TOKEN is enough. To publish elsewhere
      # (e.g. a separate public repo), add `repository:` plus a fine-grained PAT with Contents:
      # read/write as `token:`.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.zip
          generate_release_notes: true
