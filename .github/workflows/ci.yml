name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - '*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same check the pre-commit hook runs, so a commit made with --no-verify (or on a clone
  # where nobody ran installGitHooks) still gets caught. Separate from the test job because a
  # formatting complaint and a failing test are different problems and shouldn't mask each other.
  lint:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Upload ktlint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: build/reports/ktlint
          if-no-files-found: ignore

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fails the run if gradle-wrapper.jar isn't a published Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Headless self-check (dry run, no hardware)
        run: ./gradlew diagnose --args="ET-2825"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
